name: Browser smoke tests

# Optional: run on demand from Actions -> "Browser smoke tests" -> Run workflow.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-e2e.txt
      - run: playwright install --with-deps chromium
      - run: make test-e2e
        env:
          CHROMIUM_PATH: ""
